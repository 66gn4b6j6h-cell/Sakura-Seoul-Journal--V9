<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>The Sakura & Seoul Journal</title>
<style>
:root{--paper:#f8f2e9;--card:#fffaf4;--ink:#312c29;--muted:#7b716b;--rose:#d79b9e;--rose2:#f3dddc;--sage:#72816b;--line:#eadfd3;--shadow:0 16px 36px rgba(73,54,45,.10);}
*{box-sizing:border-box} html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",sans-serif} body{min-height:100vh}
.app{max-width:620px;margin:auto;padding-bottom:90px} main{padding:18px}
.serif,h1,h2,h3{font-family:Georgia,"Times New Roman",serif} .script{font-family:"Snell Roundhand","Bradley Hand",cursive;font-weight:500}
.top{padding:24px 18px 8px;display:flex;justify-content:space-between;align-items:center} .eyebrow{font-size:10px;letter-spacing:.18em;color:var(--sage);font-weight:800;text-transform:uppercase}
.brand{font-size:25px;margin:2px 0 0} .round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff9f3;font-size:18px}
.hero{height:360px;border-radius:30px;background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:var(--shadow)} .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,18,.05),rgba(30,20,18,.58))}
.heroCopy{position:absolute;z-index:2;left:24px;right:24px;bottom:25px;color:white} .heroCopy h1{font-size:38px;line-height:1.02;margin:5px 0} .heroCopy p{margin:0;line-height:1.45}
.quote{font-size:25px;text-align:center;margin:24px 10px;color:#5f514c} .intro{background:#fff8f1;border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(70,50,40,.05)} .intro h2{margin:4px 0 6px;font-size:25px} .intro p{margin:0;color:var(--muted)}
.section{margin-top:28px} .sectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px} .sectionHead h2{margin:0;font-size:24px} .sectionHead span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px} .tile{height:178px;border-radius:23px;overflow:hidden;position:relative;background-size:cover;background-position:center;border:0;text-align:left;padding:0;box-shadow:var(--shadow)} .tile:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(24,18,16,.72))} .tileText{position:absolute;z-index:2;left:14px;right:12px;bottom:14px;color:white} .tileText b{font-family:Georgia,serif;font-size:19px;display:block} .tileText small{opacity:.88}
.countryHero{height:270px;border-radius:28px;overflow:hidden;background-size:cover;background-position:center;position:relative;box-shadow:var(--shadow)} .countryHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(25,17,15,.6))} .countryCopy{position:absolute;z-index:2;left:20px;right:20px;bottom:20px;color:white} .countryCopy h1{font-size:36px;margin:0} .countryCopy .script{font-size:21px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(70,50,40,.06);margin-bottom:14px} .photo{height:220px;background-size:cover;background-position:center} .pad{padding:18px} .pad h3{font-size:24px;margin:3px 0 8px} .badges{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px} .badge{font-size:11px;padding:6px 9px;border-radius:99px;background:#edf1e9;color:#52604d;font-weight:800} .badge.rose{background:var(--rose2);color:#845657} .meta{color:var(--muted);font-size:13px} .must{background:#f4eee6;border-radius:17px;padding:13px;margin-top:13px} .must b{font-family:Georgia,serif} .must p{margin:5px 0 0;font-size:13px;line-height:1.45}
.daytabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px} .daytab{white-space:nowrap;border:1px solid var(--line);background:#fffaf4;border-radius:99px;padding:9px 12px} .daytab.active{background:#5f705b;color:white} .timeline{border-left:2px solid #e5d6cc;margin-left:9px;padding-left:20px} .stop{position:relative;margin:0 0 20px} .stop:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--rose);left:-27px;top:5px;border:3px solid var(--paper)} .stop time{font-size:11px;color:var(--sage);font-weight:800;letter-spacing:.08em} .stop h3{font-size:20px;margin:3px 0} .stop p{margin:4px 0;color:var(--muted);font-size:13px;line-height:1.45}
.product{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center} .prodArt{width:72px;height:92px;border-radius:18px;background:linear-gradient(145deg,#f4dedc,#fffaf5);display:grid;place-items:center;font-size:34px;border:1px solid var(--line)} .checks label{display:block;margin:7px 0;font-size:13px} input[type=checkbox]{accent-color:var(--sage);transform:scale(1.15);margin-right:8px}
.phrase{padding:18px;border-bottom:1px solid var(--line)} .phrase:last-child{border:0} .native{font-size:27px;font-weight:700;line-height:1.25} .roman{font-size:16px;color:#805d5d;margin-top:5px;font-weight:700} .meaning{color:var(--muted);margin:4px 0 12px} .speak{border:0;background:#5f705b;color:white;border-radius:99px;padding:10px 14px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,244,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20} .navin{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)} .nav button{border:0;background:none;padding:6px 2px;color:#7b716b;font-size:10px} .nav button b{display:block;font-size:20px;margin-bottom:2px} .nav button.active{color:#8d5d5e}
.hidden{display:none} .back{border:0;background:none;font-size:14px;color:#735b55;padding:0 0 14px;font-weight:800} .save{float:right;border:0;background:#f1e1df;border-radius:99px;padding:8px 11px}
@media(min-width:560px){.hero{height:430px} .tile{height:220px}}
</style>
</head>

<div class="timeline">${IT.map((x,i)=>`<div class="stop" id="d${i}"><time>${x[0]} • ${x[1]}</time><h3>${x[2]}</h3><p>${x[3]}</p><p>🚆 ${x[4]}</p></div>`).join('')}</div>`}
function restaurants(){
return `<button class="back" onclick="show('home')">‹ Journal</button><div class="sectionHead"><div><div class="eyebrow">TASTE KINDLY</div><h2>Restaurant journal</h2></div><span>diet labels stay visible</span></div>
${REST.map((r,i)=>`<article class="card"><div class="photo" style="background-image:url('${r[5]}')"></div><div class="pad"><button class="save" onclick="saveItem('restaurant','${r[0].replaceAll("'","\\'")}')">♡ Save</button><div class="eyebrow">${r[1]}</div><h3>${r[0]}</h3><div class="badges"><span class="badge">${r[2]}</span><span class="badge rose">${i<5?'Japan favorite':'Seoul saved lead'}</span></div><div class="meta">${r[4]}</div><div class="must"><b>Must Try</b><p>${r[3]}</p></div></div></article>`).join('')}`}
function shopping(){
return `<button class="back" onclick="show('home')">‹ Journal</button><div class="sectionHead"><div><div class="eyebrow">COLLECT BEAUTIFUL THINGS</div><h2>Shopping journal</h2></div><span>check as you go</span></div>
${SHOP.map((s,idx)=>`<article class="card"><div class="pad product"><div class="prodArt">${s[4]}</div><div><div class="eyebrow">${s[1]}</div><h3>${s[0]}</h3><div class="meta">${s[3]}</div><div class="checks">${s[2].split(' • ').map((x,j)=>`<label><input type="checkbox" data-k="shop-${idx}-${j}">${x}</label>`).join('')}</div></div></div></article>`).join('')}`}
function language(){
return `<button class="back" onclick="show('more')">‹ More</button><div class="sectionHead"><div><div class="eyebrow">SAY IT WITH CONFIDENCE</div><h2>Language cheat sheet</h2></div><span>tap 🔊</span></div>
<div class="card">${PHRASES.map((p,i)=>`<div class="phrase"><div class="eyebrow">${p[0]}</div><div class="native">${p[1]}</div><div class="roman">${p[3]}</div><div class="meaning">${p[2]}</div><button class="speak" onclick="speak(${i})">🔊 Hear pronunciation</button></div>`).join('')}</div>`}
function more(){
return `<div class="sectionHead"><div><div class="eyebrow">TRAVEL TOOLS</div><h2>More</h2></div></div><div class="tiles">
${tile("Language Cheat Sheet","Large text + audio",P.kyoto,"language")}
${tile("Itinerary","Japan day-by-day",P.osaka,"itinerary")}
${tile("Restaurants","Diet labels + must try",P.food,"restaurants")}
${tile("Shopping","Checklists",P.product,"shopping")}
</div><div class="intro section"><div class="eyebrow">Dietary note</div><h2>Riya: vegetarian + no egg</h2><p>Prioritize clearly vegan dishes. Mixed restaurants remain saved leads until the exact dish is verified for vegetarian ingredients and egg.</p></div>`}
function saved(){
let a=JSON.parse(localStorage.getItem('ss-saved')||'[]'); return `<div class="sectionHead"><div><div class="eyebrow">YOUR LITTLE COLLECTION</div><h2>Saved</h2></div><span>${a.length} saved</span></div>${a.length?a.map(x=>`<div class="card"><div class="pad"><div class="eyebrow">${x.type}</div><h3>${x.name}</h3></div></div>`).join(''):'<div class="intro"><h2>Nothing saved yet</h2><p>Tap ♡ on a restaurant to keep it here.</p></div>'}`}
function saveItem(type,name){let a=JSON.parse(localStorage.getItem('ss-saved')||'[]'); if(!a.some(x=>x.name===name))a.push({type,name});localStorage.setItem('ss-saved',JSON.stringify(a));alert('Saved to your journal ♡')}
function speak(i){let p=PHRASES[i]; speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(p[1]);u.lang=p[4];u.rate=.78;speechSynthesis.speak(u)}
function restoreChecks(){document.querySelectorAll('input[type=checkbox][data-k]').forEach(c=>{c.checked=localStorage.getItem(c.dataset.k)==='1';c.onchange=()=>localStorage.setItem(c.dataset.k,c.checked?'1':'0')})}
function show(p){navActive(['home','japan','seoul','saved','more'].includes(p)?p:''); v.innerHTML=p==='home'?home():p==='japan'?country('japan'):p==='seoul'?country('seoul'):p==='itinerary'?itinerary():p==='restaurants'?restaurants():p==='shopping'?shopping():p==='language'?language():p==='saved'?saved():more(); window.scrollTo(0,0);restoreChecks()}
show('home');
</script></body></html>
